<!DOCTYPE html>
<html>
    <head>
        <title>Fontes e Cores</title>
        <meta charset="utf-8" />
        <style type="text/css">

     .fonteSerif {
      font-family: "Times New Roman";
      font-size: 80px;
     }

     .fonteSans-Serif {
      font-family: "Verdana";
      font-size: 20px;
     }

     .fonteMonospace{
      font-family: "Courier New";
      font-size: 40px
     }
        </style>

    </head>
    
    <body>
    
      <div class=conteudo>
        <p class="fonteSerif">Programação Web</p>
        <p class="fontSans-Serif">Programação Web</p>
        <p class="fonteMonospace">Programação Web</p>
      </div>

    </body>

</html>
