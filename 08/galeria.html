<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=>, initial-scale=1.0">
        <title>galeria</title>
        <link rel="stylesheet" href="style.css">
    </head>
<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

body{
    font-family: Arial, sans-serif;
    padding: 30px;
    background-color: antiquewhite;
}

h1{
    color:aquamarine;
    margin-bottom: 30px;
    text-align:center;
}

.galeria{
    display:flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.card{
    width: 220px;
    background-color: aliceblue;
    border: 1px solid #ddd;
    padding: 10px;
    margin: 5px;
}

.card img{
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.card p{
    margin-top: 20px;
    padding: 10px;
    background-color: antiquewhite;
    border: 3px solid;
}

.texto{
    margin-top: 20px;
    padding: 10px;
    background-color: antiquewhite;
    border: 1px solid;
}

</style>

<body>
    <div class="Galeria">
        <div class="card">

            <td> <img src="imagem01.png"/></td>

            <p>resumo</p>
        </div>

         <div class="card">

            <td> <img src="imagem02.png"/></td>

            <p>resumo</p>
        </div>



    </div>

</body>

</html>
