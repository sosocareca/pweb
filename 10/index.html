<!doctype html>
<html>

<style>

    .menu{
        background: #eee685;
        font: "Trebuchet MS", Helvetica, sans-serif;
        font-size: 18px;
        padding: 10px;
    }

    a:link{ /*nao visitados*/
        color: #b9c941;
        text-decoration: none;
    }

    a:visited{ /*visitados*/
        color: #458b00;
    }

    a:hover{ /*passar o mouse*/
        color: #8b4726;
    }

    a:active{ /*clicado*/
        color: #ff1493;
    }

    a{
        text-decoration: none;
    }
</style>
