<!DOCTYPE html>
<html>
    <head>
    <style>
        body {
            font-family: Arial;
        }

        .header {
            background-color: #D82801;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .main-content {
            background-color: #FF9D56;
            width: 75%;
            float: right;
            padding: 10px;
        }

        .sidebar {
            background-color: #D364A6;
            width: 20%;
            float: left;
            padding: 10px;
        }

        .footer {
            background-color: #A70968;
            color: white;
            text-align: center;
            padding: 15px;
            clear: both;
            position: fixed;
            bottom: 0;
            width:100%;
        }
    </style>

</head>
<body>

    <div class="header">
        <h1>Minha Página Web</h1>
    </div>

    <div class="sidebar">
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>

    <div class="main-content">
        <p>Este é o conteúdo principal da página</p>
        <p>Adicione mais parágrafos ou elementos conforme necessário.</p>
    </div>

    <div class="footer">
        <p>Rodapé da Página</p>
    </div>

</body>
